<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot - Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Dashboard Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        /* Glass Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            color: var(--text-dim);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .value {
            font-size: 2rem;
            font-weight: 700;
        }

        /* Bot Status Logic */
        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-running { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .status-stopped { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        /* Controls */
        .controls {
            grid-column: span 3;
            display: flex;
            gap: 1.5rem;
        }

        .control-card {
            flex: 1;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn-stop { background: var(--danger); }
        .btn-stop:hover { background: #dc2626; }

        select {
            background: #334155;
            color: white;
            border: 1px solid var(--border);
            padding: 0.6rem 1rem;
            border-radius: 0.75rem;
            outline: none;
            width: 100%;
            margin-top: 0.5rem;
        }

        /* Trades Table */
        .table-container {
            margin-top: 2rem;
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            text-align: left;
            padding: 0.7rem 0.75rem;
            color: var(--text-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 0.7rem 0.75rem;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }

        .profit-pos { color: var(--success); }
        .profit-neg { color: var(--danger); }

        /* Trading Log */
        .log-panel {
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            height: 340px;
            overflow-y: auto;
            font-family: 'Consolas', 'Menlo', monospace;
            font-size: 0.78rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-line { color: #cbd5e1; }
        .log-muted { color: #64748b; }
        .log-info { color: #93c5fd; }
        .log-trade { color: #4ade80; }
        .log-sell { color: #f87171; }
        .log-warn { color: #fbbf24; }
        .log-error { color: #f87171; }
        .log-meta { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text-dim); }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: var(--success);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i data-lucide="zap"></i>
                QUANTUM TRADER
            </div>
            <nav style="display: flex; gap: 2rem; align-items: center;">
                <a href="/" style="color: var(--primary); text-decoration: none; font-weight: 600;">Live Trading</a>
                <a href="/backtest" style="color: var(--text-dim); text-decoration: none; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--text-dim)'">Back-test</a>
            </nav>
            <div id="connection-status">
                <span class="live-dot"></span> Live Terminal
            </div>
        </header>

        <div class="grid">
            <!-- Account Info -->
            <div class="card">
                <div class="card-title"><i data-lucide="wallet"></i> Balance</div>
                <div id="balance" class="value">---</div>
                <div style="color: var(--text-dim); font-size: 0.875rem; margin-top: 0.5rem;">USD Account</div>
            </div>

            <!-- Bot Status -->
            <div class="card">
                <div class="card-title"><i data-lucide="activity"></i> Engine Status</div>
                <div id="bot-status-text" class="value">Loading...</div>
                <div id="bot-tag-container" style="margin-top: 0.5rem;"></div>
            </div>

            <!-- Current Strategy -->
            <div class="card">
                <div class="card-title"><i data-lucide="layers"></i> Current Strategy</div>
                <div id="active-strategy-name" class="value" style="font-size: 1.5rem;">---</div>
                <div id="symbol-info" style="color: var(--text-dim); font-size: 0.875rem; margin-top: 0.5rem;">XAUUSD · M1</div>
            </div>

            <!-- Trade List -->
            <div class="card" style="grid-column: span 3;">
                <div class="card-title"><i data-lucide="list"></i> Active Positions</div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Ticket</th>
                                <th>Type</th>
                                <th>Strategy</th>
                                <th>Volume</th>
                                <th>Open Price</th>
                                <th>SL</th>
                                <th>TP</th>
                                <th>Profit</th>
                            </tr>
                        </thead>
                        <tbody id="positions-body">
                            <tr><td colspan="8" style="text-align: center; color: var(--text-dim);">No active trades</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Controls -->
            <div class="card">
                <div class="card-title"><i data-lucide="settings"></i> Control Panel</div>
                
                <div style="margin-bottom: 1.5rem;">
                    <label style="font-size: 0.75rem; color: var(--text-dim);">Switch Method</label>
                    <select id="strategy-select">
                        <option value="">Loading strategies...</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button id="toggle-btn" class="btn" onclick="toggleBot()">
                        <i data-lucide="play"></i> Start Bot
                    </button>
                    <button class="btn btn-stop" style="padding: 0.75rem" onclick="refreshData()">
                        <i data-lucide="refresh-cw"></i>
                    </button>
                </div>

                <!-- Đếm ngược tới phiên vào lệnh -->
                <div style="margin-top: 1.5rem; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 0.75rem; background: #0b1120;">
                    <div style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em;">Phiên vào lệnh</div>
                    <div id="session-countdown" style="font-size: 1.35rem; font-weight: 700; margin-top: 0.25rem;">---</div>
                    <div id="session-detail" style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.25rem;"></div>
                </div>
            </div>

            <!-- Trading Log -->
            <div class="card" style="grid-column: span 2;">
                <div class="card-title">
                    <span style="display: flex; align-items: center; gap: 0.5rem;"><i data-lucide="terminal"></i> Trading Log</span>
                    <span id="log-meta" class="log-meta" style="margin-left: auto;">---</span>
                </div>
                <div id="log-panel" class="log-panel">
                    <div class="log-muted">Đang tải log...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        const API_BASE = "http://localhost:5000/api";

        // Đếm ngược tới phiên vào lệnh
        let sessionState = { in_session: false, target: null, session: "", open_at: null };

        function formatCountdown(sec) {
            sec = Math.max(0, Math.floor(sec));
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
            return `${m}m ${String(s).padStart(2, '0')}s`;
        }

        function renderSession() {
            const el = document.getElementById('session-countdown');
            const det = document.getElementById('session-detail');
            if (!el) return;
            if (sessionState.in_session) {
                el.innerText = "Đang trong phiên";
                el.style.color = "#4ade80";
                det.innerText = sessionState.session ? `Phiên ${sessionState.session} (giờ Việt Nam)` : "";
            } else if (sessionState.target) {
                el.innerText = "Còn " + formatCountdown((sessionState.target - Date.now()) / 1000);
                el.style.color = "#fbbf24";
                det.innerText = sessionState.open_at ? `Mở lúc ${sessionState.open_at} (giờ Việt Nam)` : "";
            } else {
                el.innerText = "---";
                det.innerText = "";
            }
        }

        setInterval(renderSession, 1000);

        function escapeHtml(s) {
            return s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
        }

        function logClass(line) {
            if (line.includes('ERROR')) return 'log-error';
            if (line.includes('WARNING')) return 'log-warn';
            if (line.includes('SELL') || line.includes('LOSS')) return 'log-sell';
            if (line.includes('BUY') || line.includes('EXECUTE') || line.includes('OPENED') ||
                line.includes('CLOSED') || line.includes('PROFIT') || line.includes('BE-MOVE') ||
                line.includes('MODIFIED')) return 'log-trade';
            if (line.includes('PHIÊN')) return 'log-info';
            if (line.includes('INFO')) return 'log-info';
            return 'log-line';
        }

        async function fetchLogs() {
            try {
                const res = await fetch(`${API_BASE}/logs?lines=300`);
                const data = await res.json();
                const panel = document.getElementById('log-panel');
                if (!panel) return;
                const lines = data.lines || [];
                const atBottom = panel.scrollHeight - panel.scrollTop - panel.clientHeight < 40;
                if (lines.length === 0) {
                    panel.innerHTML = '<div class="log-muted">(Chưa có log)</div>';
                } else {
                    panel.innerHTML = lines.map(l => `<div class="${logClass(l)}">${escapeHtml(l)}</div>`).join('');
                }
                document.getElementById('log-meta').innerText = `${lines.length} dòng`;
                if (atBottom) panel.scrollTop = panel.scrollHeight;
            } catch (e) {
                console.error("Log fetch error:", e);
            }
        }

        async function fetchData() {
            try {
                // 1. Status
                const statusRes = await fetch(`${API_BASE}/status`);
                const status = await statusRes.json();
                
                document.getElementById('bot-status-text').innerText = status.bot_running ? "Running" : "Stopped";
                const tagCont = document.getElementById('bot-tag-container');
                tagCont.innerHTML = `<span class="status-tag ${status.bot_running ? 'status-running' : 'status-stopped'}">${status.bot_status}</span>`;
                
                const toggleBtn = document.getElementById('toggle-btn');
                if (status.bot_running) {
                    toggleBtn.innerHTML = `<i data-lucide="square"></i> Stop Bot`;
                    toggleBtn.className = "btn btn-stop";
                } else {
                    toggleBtn.innerHTML = `<i data-lucide="play"></i> Start Bot`;
                    toggleBtn.className = "btn";
                }
                lucide.createIcons();

                // 1b. Session countdown
                if (status.session) {
                    sessionState.in_session = status.session.in_session;
                    sessionState.session = status.session.session || "";
                    sessionState.open_at = status.session.open_at;
                    sessionState.target = status.session.in_session
                        ? null
                        : Date.now() + status.session.seconds_to_open * 1000;
                    renderSession();
                }

                // 2. Account
                const accRes = await fetch(`${API_BASE}/account`);
                const acc = await accRes.json();
                document.getElementById('balance').innerText = `$${acc.balance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;

                // 3. Positions
                const posRes = await fetch(`${API_BASE}/positions`);
                const positions = await posRes.json();
                const posBody = document.getElementById('positions-body');
                
                if (positions.length === 0) {
                    posBody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-dim);">No active trades</td></tr>';
                } else {
                    posBody.innerHTML = positions.map(p => `
                        <tr>
                            <td>#${p.ticket}</td>
                            <td style="color: ${p.type === 'BUY' ? '#4ade80' : '#f87171'}">${p.type}</td>
                            <td>${p.strategy || '-'}</td>
                            <td>${p.volume}</td>
                            <td>${p.price_open}</td>
                            <td>${p.sl ? p.sl : '—'}</td>
                            <td>${p.tp ? p.tp : '—'}</td>
                            <td class="${p.profit >= 0 ? 'profit-pos' : 'profit-neg'}">${p.profit.toFixed(2)} USD</td>
                        </tr>
                    `).join('');
                }

                // 4. Update strategy name highlight
                const stratSelect = document.getElementById('strategy-select');
                if (stratSelect.value === "") {
                    // Update dropdown once
                    loadStrategies(status.current_strategy);
                }

                // 5. Trading log
                await fetchLogs();

            } catch (e) {
                console.error("Fetch Error:", e);
            }
        }

        async function loadStrategies(currentKey) {
            const res = await fetch(`${API_BASE}/strategies`);
            const strategies = await res.json();
            const select = document.getElementById('strategy-select');
            select.innerHTML = strategies.map(s => 
                `<option value="${s.id}" ${s.id === currentKey ? 'selected' : ''}>${s.name}</option>`
            ).join('');
            
            document.getElementById('active-strategy-name').innerText = strategies.find(s => s.id === currentKey)?.name || "---";
        }

        document.getElementById('strategy-select').onchange = async (e) => {
            const id = e.target.id;
            await fetch(`${API_BASE}/strategy`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ strategy_id: e.target.value })
            });
            refreshData();
        };

        async function toggleBot() {
            await fetch(`${API_BASE}/toggle-bot`, { method: 'POST' });
            refreshData();
        }

        function refreshData() {
            fetchData();
        }

        // Auto Refresh
        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>
</html>
